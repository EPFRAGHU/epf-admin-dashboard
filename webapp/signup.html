<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Access — EPF Admin Dashboard</title>
  <meta name="description" content="Request a Consultant or Employer account on the EPF Admin Dashboard">
  <script>
    (function() {
      const saved = localStorage.getItem('epf_theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/epfo-app-theme.css">
</head>
<body>
  <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:var(--bg); padding:20px;">
    <div class="card" id="signup-card" style="width:100%; max-width:480px; padding:36px 32px; box-shadow:0 12px 40px rgba(0,0,0,0.15); border-radius:var(--radius); border:1px solid var(--card-border);">

      <div id="signup-form-view">
        <div style="text-align:center; margin-bottom:24px;">
          <span style="font-size:44px; display:block; margin-bottom:10px;">🏛️</span>
          <h2 style="margin:0; font-size:22px; font-weight:800; color:var(--text1);">Request Access</h2>
          <p style="color:var(--text2); margin-top:6px; font-size:13px;">Set up your account — a superadmin will review and approve it.</p>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:20px;">
          <button type="button" id="su-tab-consultant" class="btn btn-primary btn-sm" style="flex:1;" onclick="Signup.setRole('consultant')">Consultant</button>
          <button type="button" id="su-tab-employer" class="btn btn-ghost btn-sm" style="flex:1;" onclick="Signup.setRole('employer')">Employer</button>
        </div>

        <div id="signup-status" style="display:none; font-size:12px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px;"></div>

        <form id="signup-form" onsubmit="event.preventDefault(); Signup.submit();">
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" id="su-name-label" style="font-weight:600;">Name of the Consultant *</label>
            <input type="text" id="su-name" class="form-input" placeholder="e.g. Ramesh Chandra Patnaik" required>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" style="font-weight:600;">Email Address (Username for Login) *</label>
            <input type="email" id="su-email" class="form-input" placeholder="e.g. ramesh@epfservices.com" required>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" style="font-weight:600;">Mobile Number</label>
            <input type="tel" id="su-mobile" class="form-input" placeholder="e.g. 9876543210">
          </div>

          <div id="su-employer-fields" style="display:none;">
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label" style="font-weight:600;">Establishment Code *</label>
              <input type="text" id="su-est-code" class="form-input" placeholder="e.g. ORBBS1990770000" maxlength="15" style="font-family:monospace; font-weight:600;">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label" style="font-weight:600;">Establishment Name *</label>
              <input type="text" id="su-est-name" class="form-input" placeholder="e.g. ODISHA COMPUTER ACADEMY">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label" style="font-weight:600;">Establishment Address</label>
              <textarea id="su-est-address" class="form-input" rows="2" placeholder="Full postal address of the establishment"></textarea>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label" style="font-weight:600;">Date of Coverage</label>
              <input type="date" id="su-est-coverage" class="form-input">
            </div>
          </div>

          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" style="font-weight:600;">Password *</label>
            <input type="password" id="su-password" class="form-input" placeholder="Create a login password" required>
          </div>
          <div class="form-group" style="margin-bottom:16px;">
            <label class="form-label" style="font-weight:600;">Confirm Password *</label>
            <input type="password" id="su-password-confirm" class="form-input" placeholder="Re-enter your password" required>
          </div>

          <div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:20px;">
            <input type="checkbox" id="su-agree" style="width:16px; height:16px; margin-top:2px; cursor:pointer;" onchange="Signup.onAgreeChange()">
            <label for="su-agree" style="font-size:12px; color:var(--text2); line-height:1.5; cursor:pointer;">
              I agree to the <a href="/terms" target="_blank" rel="noopener" style="color:var(--primary);">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener" style="color:var(--primary);">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" id="signup-submit-btn" class="btn btn-primary" disabled style="width:100%; padding:12px; font-size:15px; font-weight:700;">
            Submit Request
          </button>
        </form>

        <div style="text-align:center; margin-top:20px;">
          <a href="/" style="font-size:12px; color:var(--text3); text-decoration:none;">Already have an account? Sign in</a>
        </div>
      </div>

      <div id="signup-confirmation-view" style="display:none; text-align:center; padding:12px 0;">
        <span style="font-size:48px; display:block; margin-bottom:14px;">✅</span>
        <h2 style="margin:0; font-size:20px; font-weight:800; color:var(--text1);">Request Submitted</h2>
        <p style="color:var(--text2); margin-top:10px; font-size:13px; line-height:1.5;">
          Thank you — your request has been submitted and is pending approval.<br>You'll be notified once it's reviewed.
        </p>
        <a href="/" class="btn btn-ghost" style="margin-top:20px; display:inline-block;">Back to Sign In</a>
      </div>

    </div>
  </div>

  <script src="/js/signup.js"></script>
</body>
</html>
