name: Nightly Neon → Supabase Backup

on:
  schedule:
    # 20:30 UTC daily = 02:00 IST (GitHub Actions cron always runs in UTC; IST is UTC+5:30).
    - cron: '30 20 * * *'
  workflow_dispatch: {}   # lets you trigger a one-off run from the Actions tab to test it

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Neon -> Supabase backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          # Optional -- see scripts/README.md. If this secret doesn't exist yet, the
          # expression evaluates to an empty string and the script just skips pinging.
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: python3 scripts/backup_neon_to_supabase.py

      # Runners are ephemeral, so the log written by the script wouldn't otherwise survive
      # past this job -- upload it every time (success or failure) so there's a record to
      # check without needing to reproduce a failure to see what happened.
      - name: Upload backup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-log-${{ github.run_id }}
          path: backup.log
          retention-days: 30
